# _config.yml  (PROJECT SITE)

title: "Kelvin Ervais"
description: "Data scientist building production analytics tools for sports front offices. Seattle Mariners. Georgia Tech M.S. Analytics."
theme: minima

author:
  name: Kelvin Ervais
  email: kelvinervais@gmail.com

minima:
  social_links:
    - { platform: github,   user_url: "https://github.com/kelvinervais" }
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/kelvinervais/" }

url: "https://kelvinervais.github.io"
baseurl: "/website"   # <-- REQUIRED for repo named 'website'

plugins:
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
